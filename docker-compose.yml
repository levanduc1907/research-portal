services:
  # ==========================================
  # 1. PostgreSQL Database (Port: 5432)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: chaosnote_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chaosnote
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chaosnote"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chaosnote_network

  # ==========================================
  # 2. Redis & BullMQ Queue (Port: 6379)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: chaosnote_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chaosnote_network

  # ==========================================
  # 3. Database Web GUI - Adminer (Port: 8080)
  # ==========================================
  adminer:
    image: adminer:latest
    container_name: chaosnote_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chaosnote_network

  # ==========================================
  # 4. Redis Web GUI - Redis Commander (Port: 8082)
  # ==========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: chaosnote_redis_commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - chaosnote_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  chaosnote_network:
    driver: bridge
