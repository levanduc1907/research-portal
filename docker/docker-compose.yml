services:
  # ==========================================
  # 1. MySQL Database (Custom Build, Port: 3306)
  # ==========================================
  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    image: uiuc-research-mysql:latest
    container_name: uiuc_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-uiuc_research}
      MYSQL_USER: ${MYSQL_USER:-uiuc_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-uiuc_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uiuc_network

  # ==========================================
  # 2. Redis & BullMQ Queue (Port: 6379)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: uiuc_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uiuc_network

  # ==========================================
  # 3. Qdrant Vector Database (Port: 6333, 6334)
  # ==========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: uiuc_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - uiuc_network

  # ==========================================
  # 4. Database Web GUI - Adminer (Port: 8080)
  # ==========================================
  adminer:
    image: adminer:latest
    container_name: uiuc_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - uiuc_network

  # ==========================================
  # 5. Redis Web GUI - Redis Commander (Port: 8082)
  # ==========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: uiuc_redis_commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - uiuc_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  uiuc_network:
    driver: bridge
